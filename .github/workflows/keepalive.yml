# Supabase 무료 프로젝트가 "사용 없음"으로 일시정지되지 않도록
# 하루에 한 번 모집글 목록 함수를 호출합니다. (읽기만 하고 아무것도 바꾸지 않음)
#
# 주소와 키는 js/config.js 에 이미 공개돼 있는 값을 그대로 읽어 씁니다.
# 수동으로 실행해 보려면: GitHub 저장소 → Actions → Supabase keep-alive → Run workflow
#
# 참고: 저장소에 60일 동안 커밋이 없으면 GitHub가 이 예약 실행을 자동으로 끕니다.
#       그때는 Actions 탭에서 다시 켜거나 커밋을 하나 올리면 됩니다.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 21 * * *'   # 매일 21:17 UTC = 한국 시간 오전 6:17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 모집글 목록 호출
        run: |
          URL=$(grep -oE "SUPABASE_URL: *'[^']+'" js/config.js | sed -E "s/.*'([^']+)'/\1/")
          KEY=$(grep -oE "SUPABASE_ANON_KEY: *'[^']+'" js/config.js | sed -E "s/.*'([^']+)'/\1/")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "js/config.js 에서 Supabase 주소나 키를 찾지 못했습니다."
            exit 1
          fi

          STATUS=$(curl -sS -o response.json -w "%{http_code}" --max-time 60 \
            -X POST "$URL/rest/v1/rpc/list_games" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "응답 코드: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Supabase가 정상 응답하지 않았습니다. 프로젝트가 일시정지됐는지 대시보드에서 확인하세요."
            head -c 500 response.json
            exit 1
          fi
          echo "정상입니다."
